name: Build and Deploy

# 向主干 main 分支推送代码时触发部署
on:
  push:
    branches:
      - main

# 新增：并发控制（同分支新构建触发时，自动取消正在进行的旧构建）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '11.25.0' # 指定 pnpm 版本，建议与本地使用的版本保持一致
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0' # 选择适合的 Node.js 版本
          cache: 'pnpm' # 自动基于 pnpm-lock.yaml 启用依赖缓存
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build project
        run: npm run build:web
      
      # 使用密码将打包好的文件通过 SCP 上传到服务器
      - name: Upload dist to Server via SCP
        if: ${{ vars.DEPLOY_MODE == 'scp' }}
        uses: easingthemes/ssh-deploy@main
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.LOGIN_NAME }}
          password: ${{ secrets.LOGIN_PASSWORD }}
          source: "dist/web/*"                  # 本地要上传的文件夹路径
          target: "/var/www/${{ secrets.SERVER_NAME }}"         # 服务器上的目标目录
          strip_components: 1               # 过滤掉顶层的 "dist/" 文件夹，直接将内容解压到 target 目录
          rm: true                          # 类似 --delete，上传前自动清空目标目录下的旧文件
          debug: true                       # 👈 新增：开启调试打印，逐行输出传输文件明细

    
      # 替换原有的 SCP 步骤：使用 sshpass + rsync 极速增量传输（支持密码登录）
      - name: Deploy dist to Server via Rsync
        if: ${{ vars.DEPLOY_MODE != 'csp' }} # 默认模式
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.LOGIN_NAME }}
          PASS: ${{ secrets.LOGIN_PASSWORD }}
          TARGET: "/var/www/${{ secrets.SERVER_NAME }}"
        run: |
          # 1. 安装 sshpass 辅助工具
          sudo apt-get update && sudo apt-get install -y sshpass rsync

          # 2. 执行 rsync 增量同步
          # -a: 归档模式，保留权限与时间戳
          # -v: 显示详细日志
          # -z: 传输时压缩数据（大幅缩短跨国传输时间）
          # --delete: 删除服务器目标目录中多余的旧文件（保持与 dist 绝对一致）
          sshpass -p "$PASS" rsync -avz --info=progress2 --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/web/ "$USER@$HOST:$TARGET/"
      
      # 新增步骤：通过 SSH 重载/重启 Nginx
      - name: Reload Nginx Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.LOGIN_NAME }}
          password: ${{ secrets.LOGIN_PASSWORD }}
          script: |
            sudo nginx -t && sudo systemctl reload nginx